name: Bootstrap repository
on:
  push:
    paths:
      - bootstrap.ready
permissions:
  contents: write
jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Expand project archive
        shell: bash
        run: |
          if [ ! -f bootstrap.ready ]; then
            echo "bootstrap already consumed"
            exit 0
          fi
          cat bootstrap.part* | base64 -d > bootstrap.zip
          rm -rf .bootstrap
          mkdir .bootstrap
          unzip -q bootstrap.zip -d .bootstrap
          rsync -a .bootstrap/ ./
          rm -rf .bootstrap bootstrap.zip bootstrap.part* bootstrap.ready
      - name: Commit project tree
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "feat: publish GSA Cooffice v0.2"
          git push origin HEAD:main
