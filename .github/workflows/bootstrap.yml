name: Bootstrap repository
on:
  push:
    paths:
      - bootstrap.ready
permissions:
  contents: write
jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct and verify project archive
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f bootstrap.ready ]; then
            echo "bootstrap already consumed"
            exit 0
          fi

          cat             bootstrap.part00 bootstrap.part01             bootstrap.seg02_00 bootstrap.seg02_01 bootstrap.seg02_02 bootstrap.seg02_03 bootstrap.seg02_04             bootstrap.seg03_00 bootstrap.seg03_01 bootstrap.seg03_02 bootstrap.seg03_03 bootstrap.seg03_04             bootstrap.seg04_00 bootstrap.seg04_01 bootstrap.seg04_02 bootstrap.seg04_03 bootstrap.seg04_04             bootstrap.part05 bootstrap.part06             | base64 -d > bootstrap.zip

          echo "9a871399fd436da06a0fdccfae0a2c8362df989542b934962e468ee57cde4e69  bootstrap.zip" | sha256sum -c -
          unzip -tq bootstrap.zip

          rm -rf .bootstrap
          mkdir .bootstrap
          unzip -q bootstrap.zip -d .bootstrap
          rsync -a .bootstrap/ ./

          rm -rf .bootstrap bootstrap.zip bootstrap.part* bootstrap.seg* bootstrap.ready
          rm -f .github/workflows/bootstrap.yml

      - name: Commit project tree
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "feat: publish GSA Cooffice v0.2"
          git push origin HEAD:main
